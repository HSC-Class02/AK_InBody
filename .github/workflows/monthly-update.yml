name: Monthly DART Update
on:
  schedule:
    - cron: '17 0 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/dart_agent.py'
      - 'dashboard/build_dashboard.py'
      - 'config.json'
      - 'requirements.txt'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: inbody-data-update
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile-check the agent and dashboard
        run: python -m py_compile src/dart_agent.py dashboard/build_dashboard.py
      - name: Verify API secret exists
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        shell: bash
        run: |
          if [ -z "$DART_API_KEY" ]; then
            echo "::error::Missing Actions secret DART_API_KEY."
            exit 1
          fi
      - name: Fetch financial statements and build dashboard
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python src/dart_agent.py
          python dashboard/build_dashboard.py
      - name: Commit updated raw data, processed metrics and site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed docs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No data or dashboard changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh InBody OpenDART financial data"
          # Reconcile commits made while this collection job was running.
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v5
