name: OpenDART API Smoke Test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dart-smoke-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Test API key and disclosure-list endpoint
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import date, timedelta
          key = os.environ.get("DART_API_KEY", "").strip()
          if not key:
              raise SystemExit("Missing DART_API_KEY secret.")
          end = date.today()
          start = end - timedelta(days=89)
          params = {
              "crtfc_key": key,
              "bgn_de": start.strftime("%Y%m%d"),
              "end_de": end.strftime("%Y%m%d"),
              "page_no": "1",
              "page_count": "1",
              "pblntf_ty": "A",
              "corp_name": "인바디",
          }
          url = "https://opendart.fss.or.kr/api/list.json?" + urllib.parse.urlencode(params)
          with urllib.request.urlopen(url, timeout=15) as response:
              result = json.loads(response.read().decode("utf-8"))
          status = str(result.get("status", ""))
          print(f"Disclosure-list API status: {status}; message: {result.get('message', '')}")
          if status not in {"000", "013"}:
              raise SystemExit("OpenDART rejected the request. Check API key status, quota, and request parameters.")
          print("OpenDART connectivity and key check passed.")
          PY
