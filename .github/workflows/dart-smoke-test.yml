name: OpenDART API Smoke Test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dart-smoke-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test a valid three-month disclosure-list request
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import date, timedelta
          key = os.environ.get("DART_API_KEY", "").strip()
          if not key:
              raise SystemExit("Missing DART_API_KEY secret.")
          end = date.today()
          start = end - timedelta(days=89)
          params = {
              "crtfc_key": key,
              "bgn_de": start.strftime("%Y%m%d"),
              "end_de": end.strftime("%Y%m%d"),
              "page_no": "1",
              "page_count": "1",
              "pblntf_ty": "A",
              "corp_name": "인바디",
          }
          url = "https://opendart.fss.or.kr/api/list.json?" + urllib.parse.urlencode(params)
          with urllib.request.urlopen(url, timeout=15) as response:
              result = json.loads(response.read().decode("utf-8"))
          status = str(result.get("status", ""))
          print(f"Disclosure-list API status: {status}; message: {result.get('message', '')}")
          if status not in {"000", "013"}:
              raise SystemExit("Disclosure-list request was rejected; check API key status/quota and request parameters.")
          PY
      - name: Check corpCode.xml download and InBody code lookup
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python - <<'PY'
          import io, os, urllib.parse, urllib.request, zipfile, xml.etree.ElementTree as ET
          key = os.environ.get("DART_API_KEY", "").strip()
          url = "https://opendart.fss.or.kr/api/corpCode.xml?" + urllib.parse.urlencode({"crtfc_key": key})
          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  body = response.read()
          except Exception as exc:
              raise SystemExit(f"corpCode.xml request failed: {type(exc).__name__}: {exc}")
          print(f"corpCode.xml downloaded: {len(body):,} bytes")
          with zipfile.ZipFile(io.BytesIO(body)) as archive:
              xml_names = [n for n in archive.namelist() if n.lower().endswith(".xml")]
              if not xml_names:
                  raise SystemExit("corpCode.xml response did not contain XML.")
              root = ET.fromstring(archive.read(xml_names[0]))
          match = next((x for x in root.findall("list") if (x.findtext("stock_code") or "").strip().zfill(6) == "041830"), None)
          print(f"InBody stock code 041830 found: {match is not None}")
          if match is None:
              raise SystemExit("InBody stock code 041830 was not found in corpCode.xml.")
          PY
