name: Monthly DART Update
on:
  schedule:
    - cron: '17 0 1 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: inbody-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify API key
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$DART_API_KEY" ]; then
            echo "::error::Set DART_API_KEY in repository Actions secrets"
            exit 1
          fi
      - name: Fetch and build
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python src/dart_agent.py
          python dashboard/build_dashboard.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "chore: update InBody DART financial data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
